    <title>نبراس - نظام إدارة المدرسة القرآنية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Cairo', 'Tajawal', 'ui-sans-serif', 'system-ui', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'Helvetica Neue', 'Arial', 'sans-serif'],
            },
          },
        },
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@200..1000&family=Tajawal:wght@200..900&display=swap" rel="stylesheet">
    <style>
      :root {
        --font-main: 'Cairo', 'Tajawal', sans-serif;
      }
      
      body {
        font-family: var(--font-main);
        background-color: #f8fafc;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      /* تحسين وراثة الخط للعناصر التي قد تتجاهل خط الجسم الأساسي */
      button, input, optgroup, select, textarea {
        font-family: var(--font-main) !important;
      }

      /* تحسين شريط التمرير للواجهة العربية */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #f1f5f9;
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #94a3b8;
      }

      /* منع تمدد الصور في النماذج */
      img {
        max-width: 100%;
        height: auto;
      }
    </style>
